<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>High Divide Loop</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d6a85">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{--bg:#eef2f1;--fg:#16262b;--mut:#5b6e73;--card:#fff;--line:#cfdad9;--acc:#0d6a85;--hi:#d4571c}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1d;--fg:#e3eeee;--mut:#8fa6aa;--card:#15262a;--line:#2a4046;--acc:#5cc3df;--hi:#ff8d52}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#map{position:absolute;inset:0 0 var(--sh,45%) 0}
#sheet{position:absolute;left:0;right:0;bottom:0;height:var(--sh,45%);background:var(--bg);border-top:4px solid var(--acc);box-shadow:0 -3px 10px #0004;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0)}
#tabs{display:flex;gap:6px;padding:8px 10px}
#tabs button,.btn{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font:inherit;font-weight:600}
#tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#body{overflow:auto;padding:0 14px 16px;flex:1}
h2{font:700 1.25rem Georgia,serif;margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin:10px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}.stats b{display:block;font:700 1.15rem Georgia,serif}.stats span{color:var(--mut);font-size:.8rem}
.stop{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.stop i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--hi);color:var(--bg);font:700 .8rem/24px system-ui;text-align:center;font-style:normal}.mk,.stop i{color:#fff;text-align:center;font-style:normal;font-weight:700}
.mk{width:28px;height:28px;border-radius:50%;border:2px solid #fff;font-size:15px;line-height:24px;box-shadow:0 1px 4px #0006}
.mk.s,.mk.e,.stop.s i,.stop.e i{background:#d32f2f}.mk.s,.mk.e{width:34px;height:34px;border-radius:9px;font-size:18px;line-height:30px;margin:-3px}
.mk.c,.stop.c i{background:#1e6fe0}.mk.p,.stop.p i{background:#f5a623;color:#3a2a00}
.stop i{font-size:.95rem;line-height:24px}.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--mut);margin:8px 0}.leg b{color:var(--fg)}
.stop p{margin:0}small{color:var(--mut)}
svg.pr{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px}
details{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}summary{color:var(--mut);font-weight:600}
.fab{position:absolute;right:10px;z-index:900;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:1.15rem;box-shadow:0 1px 4px #0004}
.num{background:var(--hi);color:#fff;border:2px solid #fff;border-radius:50%;font:700 11px/18px system-ui;text-align:center}.num.c{background:var(--acc)}
.wat{font-size:16px;text-align:center;line-height:20px}
#toast{position:absolute;top:calc(8px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);z-index:1000;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:6px 12px;border-radius:16px;font-size:.85rem;display:none}
#hud{max-width:calc(100% - 64px);position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0));z-index:900;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:4px 8px;box-shadow:0 1px 4px #0004;font-size:.8rem;font-family:inherit}
#cmp{display:flex;flex-direction:column;align-items:center;gap:0;min-width:54px}.hrow{display:flex;gap:6px;align-items:flex-start}#cmp b{font-size:.8rem}
#dial{width:41px;height:41px;transition:transform .15s linear}
</style></head><body>
<div id="map"></div><div id="toast"></div>
<button class="fab" id="loc" style="top:calc(10px + env(safe-area-inset-top,0))" title="My location">◎</button>
<button class="fab" id="wtr" style="top:calc(60px + env(safe-area-inset-top,0))" title="Water spots">💧</button>
<button class="fab" id="lns" style="top:calc(110px + env(safe-area-inset-top,0))" title="Show or hide trip lines">〰</button>
<div id="hud"><div class="hrow"><button class="chip" id="cmp" title="Compass (true north). Tap to enable."><span style="font-size:10px;line-height:8px;color:var(--hi)">▼</span><svg id="dial" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="none" stroke="var(--line)" stroke-width="2"/><polygon points="24,5 29,24 19,24" fill="#d32f2f"/><polygon points="24,43 29,24 19,24" fill="var(--mut)"/><text x="24" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">N</text></svg><b id="hd">–°</b></button><div class="chip" id="elv">⛰ <small>waiting for GPS</small></div></div><div class="chip" id="prg" style="display:none;max-width:235px"></div></div>
<div id="sheet"><div id="tabs"></div><div id="body"><p style="padding:6px 14px"><b>Starting app…</b><br><small>Page version 18. If this message stays, the app did not finish starting.</small></p></div></div>
<script>if(navigator.serviceWorker){var rs0=/[?&]reset/.test(location.search);navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){var w=r.active||r.waiting||r.installing,u=w?w.scriptURL:"";if(rs0||!/\/sw\.js$/.test(u))r.unregister()})});if(rs0){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})});try{localStorage.clear()}catch(e){}}}</script><script>addEventListener("error",function(e){var b=document.getElementById("body");if(b)b.innerHTML="<p><b>Something went wrong.</b></p><p><small>"+e.message+" ("+String(e.filename||"").split("/").pop()+":"+e.lineno+")</small></p>"})</script><script src="lib/leaflet.js"></script><script src="data.js"></script><script src="app.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){r.update()})</script>
</body></html>
